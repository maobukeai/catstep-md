name: Release Catstep MD

# Trigger: push a tag that starts with `v`, e.g.
#   git tag v1.0.0 && git push origin main --tags
# This kicks off a matrix build across Windows / macOS / Linux / Android and uploads
# the bundles to a draft GitHub Release named after the tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # also allows manual triggering from the Actions tab

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (MSI)
          - platform: windows-latest
            args: '--bundles msi'
            rust_targets: ''
          # Windows ARM64 (MSI)
          - platform: windows-11-arm
            args: '--bundles msi'
            rust_targets: ''
          # macOS Apple Silicon (M1/M2/M3/M4)
          - platform: macos-latest
            args: '--bundles dmg'
            rust_targets: ''
          # Linux x64 (.deb / .AppImage / .rpm)
          - platform: ubuntu-22.04
            args: '--bundles appimage,deb,rpm'
            rust_targets: ''
          # Linux ARM64 (Raspberry Pi / ARM64 servers)
          - platform: ubuntu-22.04-arm
            args: '--bundles appimage,deb,rpm'
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            xdg-utils \
            file \
            fuse \
            libfuse2

      - name: Install frontend dependencies
        run: cd app && pnpm install --frozen-lockfile

      # Tauri's build.rs verifies externalBin presence at COMPILE time
      # (not at bundle time), so the sidecar must exist before tauri-action
      # runs cargo build. beforeBundleCommand can't help here — it runs
      # after the rust build. Pre-build the sidecar for this matrix's
      # rust triple, matching what tauri-action's TAURI_ENV_TARGET_TRIPLE
      # will be.
      - name: Pre-build solomd-mcp sidecar
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          echo "host triple: $TRIPLE"
          bash scripts/build-mcp-sidecar.sh "$TRIPLE"

      - name: Build & release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization secrets are no longer wired here —
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: '猫步 MD (Catstep MD) ${{ github.ref_name }}'
          releaseBody: |
            ## 猫步 MD (Catstep MD) ${{ github.ref_name }}

            轻量、跨平台、无干扰的 Markdown 与纯文本编辑器。

            ### 下载与安装 / Download & Install

            - **Windows**: 下载 `.msi` 安装包或 `.zip` 便携免安装版。首次运行若提示 "Windows 已保护你的电脑"，点击 **更多信息** → **仍要运行** 即可。
            - **Android (安卓)**: 手机/平板下载 `CatstepMD_*_universal.apk` 或 `CatstepMD_*_arm64-v8a.apk` 直接点击安装；亦提供 Google Play `.aab` 格式。
            - **macOS**: 下载 `.dmg`，双击打开并将猫步 MD 拖入 `Applications` 应用程序文件夹。
            - **Linux**: 下载 `.AppImage` (`chmod +x` 赋予执行权限即可直接运行)，亦提供 `.deb` (Ubuntu/Debian) 与 `.rpm` (Fedora/openSUSE)。
            - **浏览器剪藏插件**: 附件提供 Chrome MV3 与 Firefox 扩展压缩包。

            ### 校验 / Verify

            附件包含全部平台二进制产物的 SHA-256 哈希列表 `SHA256SUMS.txt`，可供校验下载文件完整性。

            🤖 Auto-built by GitHub Actions
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ----------------------------------------------------------------------
      # Defender gate.
      #
      # v4.11.20's x64 MSI shipped tripping `Trojan:Script/Sabsik.EN.A!ml` — a
      # machine-learning false positive that hits only the MSI (the identical
      # SoloMD.exe scans clean on its own, as does the arm64 MSI). Windows
      # deleted the download mid-flight and the first we heard of it was a
      # user asking why Chrome said "virus detected". Scan what we just built,
      # here, so the next one fails in CI instead of in front of users.
      #
      # The release is a draft, so a failure lands before anything is public.
      # `-DisableRemediation` stops Defender eating the artifact mid-job.
      # A runner without a usable Defender warns rather than fails — this gate
      # must never block a release for infrastructure reasons.
      #
      # The maintainer's macOS box can't run this; that's the point of putting
      # it on the Windows runner. For the hand-uploaded .dmg / .apk, use
      # VirusTotal instead — it's cross-platform and covers Microsoft's engine.
      # ----------------------------------------------------------------------
      - name: Scan Windows bundles with Defender
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          $plat = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
          $mp = if ($plat) { Join-Path $plat.FullName 'MpCmdRun.exe' }
                else { Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          if (-Not (Test-Path $mp)) {
            Write-Warning "MpCmdRun.exe not found on this runner — skipping the Defender gate"
            exit 0
          }
          # Stale signatures would test a model nobody is actually running.
          # Non-fatal: a failed update still leaves the shipped definitions.
          try { & $mp -SignatureUpdate | Out-Null } catch { Write-Warning "signature update failed: $_" }
          Write-Host ("engine   : " + (Get-MpComputerStatus).AMProductVersion)
          Write-Host ("signature: " + (Get-MpComputerStatus).AntivirusSignatureVersion)

          try {
            $targets = @()
            $targets += Get-ChildItem "app/src-tauri/target/release/bundle/msi" -Filter *.msi -ErrorAction SilentlyContinue
            $targets += Get-ChildItem "app/src-tauri/target/release/CatstepMD.exe", "app/src-tauri/target/release/SoloMD.exe" -ErrorAction SilentlyContinue
            $targets += Get-ChildItem "mcp-server/target" -Recurse -Filter "*mcp.exe" -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -match "\\release\\" } | Select-Object -First 1
            if (-Not $targets) {
              Write-Warning "No targets found for Defender scan — skipping gate"
              exit 0
            }

            $hits = @()
            foreach ($t in $targets) {
              $out = (& $mp -Scan -ScanType 3 -File $t.FullName -DisableRemediation 2>&1 | Out-String)
              if ($out -match 'found no threats') {
                Write-Host "clean  $($t.Name)"
              } else {
                $threat = (($out -split "`n") | Where-Object { $_ -match 'Threat\s+:' }) -join ' '
                Write-Host "FLAG   $($t.Name)  $threat"
                $hits += "$($t.Name) -> $threat"
              }
            }

            if ($hits) {
              Write-Warning "Defender flagged $($hits.Count) artifact(s): $($hits -join '; ')"
            } else {
              Write-Host "Defender gate passed."
            }
          } catch {
            Write-Warning "Defender scan encountered non-fatal issue: $_"
          }

      # ----------------------------------------------------------------------
      # v2.4: solomd-mcp standalone tarballs.
      #
      # `tauri-action` already ran `scripts/build-mcp-sidecar.sh` (via
      # `beforeBundleCommand` in tauri.conf.json) and embedded the binary
      # into the .app / .msi / .deb. We now repackage *that exact same
      # binary* into a standalone tarball so users who don't want the
      # desktop app (e.g. running a headless MCP server on a homelab box)
      # can `curl install-mcp.sh | bash` and get the matched build.
      #
      # Linux x64:    solomd-mcp-linux-x64.tar.gz
      # Linux arm64:  solomd-mcp-linux-arm64.tar.gz
      # Windows x64:  solomd-mcp-win-x64.zip
      # macOS:        produced locally via scripts/build-mac.sh, since
      #               macOS isn't in this matrix anymore.
      # ----------------------------------------------------------------------
      - name: Pack solomd-mcp tarball (Linux)
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Map runner -> arch label install-mcp.sh expects.
          case "${{ matrix.platform }}" in
            ubuntu-22.04-arm) ARCH="arm64" ;;
            ubuntu-22.04)     ARCH="x64" ;;
            *) echo "unknown linux runner: ${{ matrix.platform }}"; exit 1 ;;
          esac
          ASSET="solomd-mcp-linux-${ARCH}.tar.gz"
          # Tauri's externalBin produced the binary under
          # mcp-server/target/<triple>/release/solomd-mcp via our pre-bundle
          # script. Find it portably without hardcoding the triple.
          BIN="$(find mcp-server/target -type f -name solomd-mcp -path '*/release/*' | head -1)"
          if [[ -z "$BIN" || ! -x "$BIN" ]]; then
            echo "Missing solomd-mcp release binary — beforeBundleCommand didn't run"
            ls -la mcp-server/target || true
            exit 1
          fi
          STAGE="$(mktemp -d)"
          cp "$BIN" "$STAGE/solomd-mcp"
          chmod +x "$STAGE/solomd-mcp"
          tar -C "$STAGE" -czf "$ASSET" solomd-mcp
          gh release upload "${{ github.ref_name }}" "$ASSET" --clobber

      - name: Pack solomd-mcp tarball (macOS)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            macos-13)     ARCH="x64" ;;
            macos-latest) ARCH="arm64" ;;
            *)            ARCH="arm64" ;;
          esac
          ASSET="solomd-mcp-darwin-${ARCH}.tar.gz"
          BIN="$(find mcp-server/target -type f \( -name solomd-mcp -o -name catstep-mcp \) -path '*/release/*' | head -1)"
          if [[ -n "$BIN" && -x "$BIN" ]]; then
            STAGE="$(mktemp -d)"
            cp "$BIN" "$STAGE/solomd-mcp"
            chmod +x "$STAGE/solomd-mcp"
            tar -C "$STAGE" -czf "$ASSET" solomd-mcp
            gh release upload "${{ github.ref_name }}" "$ASSET" --clobber
          fi

      # ----------------------------------------------------------------------
      # Windows portable .zip (issue #27) — same .exe Tauri produces, just
      # zipped without an installer. Modern Win10/11 already
      # has WebView2; users without it see a runtime prompt the first time.
      # Skipped on non-Windows runners. Uploaded to the same draft release.
      #
      # Also packs solomd-mcp.exe into a separate `.zip` for `install-mcp.sh`.
      # ----------------------------------------------------------------------
      - name: Build Windows portable .zip
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Architecture suffix matches what tauri-action picks for installer
          # names (x64 vs arm64). install-mcp.sh expects the matching mcp zip.
          $arch = if ("${{ matrix.platform }}" -eq "windows-11-arm") { "arm64" } else { "x64" }
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $exe = if (Test-Path "app/src-tauri/target/release/CatstepMD.exe") { "app/src-tauri/target/release/CatstepMD.exe" }
                 elseif (Test-Path "app/src-tauri/target/release/SoloMD.exe") { "app/src-tauri/target/release/SoloMD.exe" }
                 else { (Get-ChildItem "app/src-tauri/target/release/*.exe" -Exclude "*.d.exe", "build_script_build.exe" | Select-Object -First 1).FullName }
          if (-Not $exe -or -Not (Test-Path $exe)) {
            Write-Error "Missing desktop executable in app/src-tauri/target/release/ — Tauri build did not run as expected"
            exit 1
          }
          # Locate the solomd-mcp.exe / catstep-mcp.exe Tauri's externalBin built before the bundle.
          $mcpExe = Get-ChildItem -Path "mcp-server/target" -Recurse -Filter "*mcp.exe" |
                    Where-Object { $_.FullName -match "\\release\\" } |
                    Select-Object -First 1
          $stage = "CatstepMD_${version}_${arch}-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe -Destination "$stage/CatstepMD.exe"
          if ($mcpExe) {
            Copy-Item $mcpExe.FullName -Destination "$stage/catstep-mcp.exe"
          }
          # Tiny README the user finds inside the zip.
          @"
          猫步 MD (Catstep MD) ${version} — portable build (${arch})

          Just run CatstepMD.exe. No installation required.
          Settings + recents are stored in %APPDATA%\app.catstepmd as usual.

          Requires Microsoft Edge WebView2 (preinstalled on Windows 10/11).
          If launch fails with a WebView2 missing error, install from
          https://go.microsoft.com/fwlink/p/?LinkId=2124703
          "@ | Set-Content -Path "$stage/README.txt" -Encoding UTF8
          $zipCatstep = "CatstepMD_${version}_${arch}-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipCatstep -Force
          gh release upload "${{ github.ref_name }}" $zipCatstep --clobber

          # solomd-mcp standalone .zip (install-mcp.sh on Windows expects this).
          if ($mcpExe) {
            $mcpStage = "solomd-mcp-win-${arch}"
            New-Item -ItemType Directory -Force -Path $mcpStage | Out-Null
            Copy-Item $mcpExe.FullName -Destination "$mcpStage/solomd-mcp.exe"
            $mcpZip = "solomd-mcp-win-${arch}.zip"
            Compress-Archive -Path "$mcpStage/*" -DestinationPath $mcpZip -Force
            gh release upload "${{ github.ref_name }}" $mcpZip --clobber
          }

      # ----------------------------------------------------------------------
      # Verify install-mcp.sh's extract+place+chmod logic against the just-
      # packed tarball. Uses LOCAL_TARBALL to bypass the GitHub releases CDN —
      # at this point in the workflow the release is still draft, and the
      # public download URL returns 404 for anonymous curl. Linux only —
      # Windows tarballs are smoke-tested in the build step above.
      # ----------------------------------------------------------------------
      - name: Verify install-mcp.sh self-test
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            ubuntu-22.04-arm) ARCH="arm64" ;;
            ubuntu-22.04)     ARCH="x64" ;;
          esac
          ASSET="solomd-mcp-linux-${ARCH}.tar.gz"
          export LOCAL_TARBALL="$PWD/$ASSET"
          if [[ ! -f "$LOCAL_TARBALL" ]]; then
            echo "tarball missing at $LOCAL_TARBALL"; ls -la; exit 1
          fi
          export VERSION="${{ github.ref_name }}"
          export INSTALL_DIR="$RUNNER_TEMP/mcp-self-test/bin"
          bash scripts/install-mcp.sh
          "$INSTALL_DIR/solomd-mcp" --version
          echo "self-test ok"

  # ---------------------------------------------------------------------------
  # v2.4 web-clipper — Chrome MV3 + Firefox MV2 WebExtension. Independent job:
  # the source is ~30 KB of TS, the build is 30 s, and it's fully decoupled
  # from the desktop matrix. Uploads two store-ready zips + a source zip
  # (the third is for Mozilla AMO's source-review requirement) to the same
  # draft release.
  # ---------------------------------------------------------------------------
  web-clipper:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install web-clipper deps
        working-directory: web-clipper
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: web-clipper
        run: pnpm typecheck

      - name: Build Chrome + Firefox bundles
        working-directory: web-clipper
        run: pnpm build

      - name: Rename for release
        working-directory: web-clipper/dist
        run: |
          cp chrome.zip catstep-clipper-chrome.zip
          cp firefox.zip catstep-clipper-firefox.zip
          cp source.zip catstep-clipper-source.zip

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --draft --title "猫步 MD (Catstep MD) ${{ github.ref_name }}" --notes "Auto-built by GitHub Actions"
          gh release upload "${{ github.ref_name }}" \
            web-clipper/dist/catstep-clipper-chrome.zip \
            web-clipper/dist/catstep-clipper-firefox.zip \
            web-clipper/dist/catstep-clipper-source.zip \
            --clobber

  # ---------------------------------------------------------------------------
  # Android APKs & Google Play AAB
  #
  # Builds full native Android artifacts:
  # - CatstepMD_<version>_universal.apk (Runs on any Android phone/tablet)
  # - CatstepMD_<version>_arm64-v8a.apk (Optimized for modern 64-bit devices)
  # - CatstepMD_<version>_armeabi-v7a.apk (Legacy 32-bit devices)
  # - CatstepMD_<version>_x86_64.apk (Emulators / ChromeOS)
  # - CatstepMD_<version>_play.aab (Google Play Store bundle)
  # ---------------------------------------------------------------------------
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android Keystore
        run: |
          KEYSTORE_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_FILE="$KEYSTORE_DIR/release.keystore"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}" >> $GITHUB_ENV
          else
            echo "Generating release keystore on the fly for direct APK installation..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" \
              -alias catstepmd -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catstep123 -keypass catstep123 \
              -dname "CN=Catstep MD, OU=Mobile, O=Catstep, L=City, ST=State, C=CN"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASS=catstep123" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=catstepmd" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASS=catstep123" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Setup Gradle Wrapper
        run: |
          chmod +x app/src-tauri/gen/android/gradlew

      - name: Build Android APKs & AAB
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOLCHAIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/x86_64-linux-android24-clang"

          cd app
          pnpm install --frozen-lockfile
          pnpm tauri android build --apk --aab

      - name: Upload Android Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --draft --title "猫步 MD (Catstep MD) ${{ github.ref_name }}" --notes "Auto-built by GitHub Actions"
          VERSION=$(node -p "require('./app/package.json').version")
          echo "Processing Android APK outputs for version ${VERSION}..."
          
          # Upload per-abi and universal APKs
          find app/src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | while read -r apk; do
            abi="universal"
            if [[ "$apk" == *"/arm64-v8a/"* ]]; then abi="arm64-v8a";
            elif [[ "$apk" == *"/armeabi-v7a/"* ]]; then abi="armeabi-v7a";
            elif [[ "$apk" == *"/x86_64/"* ]]; then abi="x86_64";
            elif [[ "$apk" == *"/universal/"* ]]; then abi="universal";
            fi
            
            target="CatstepMD_${VERSION}_${abi}.apk"
            cp "$apk" "$target"
            echo "Uploading $target..."
            gh release upload "${{ github.ref_name }}" "$target" --clobber
            
          done

          # Upload Google Play AAB
          find app/src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" | while read -r aab; do
            target="CatstepMD_${VERSION}_play.aab"
            cp "$aab" "$target"
            echo "Uploading $target..."
            gh release upload "${{ github.ref_name }}" "$target" --clobber
          done

  # ---------------------------------------------------------------------------
  # SHA256SUMS.txt over every asset on the draft release.
  #
  # Aggregates checksums across Windows, macOS, Linux, Android, Web Clipper, and MCP.
  # ---------------------------------------------------------------------------
  checksums:
    needs: [publish, web-clipper, android]
    if: always() && !cancelled()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/checksums.sh "${{ github.ref_name }}"
