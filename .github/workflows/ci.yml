name: CI Quality Gate

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality Gate (i18n, Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: |
          cd app
          pnpm install --frozen-lockfile

      - name: Verify 14-Language i18n Parity (100% Coverage)
        run: |
          cd app
          pnpm run i18n:check

      - name: Run Unit Test Suite
        run: |
          cd app
          pnpm test

      - name: Type Check & Production Build (vue-tsc + vite)
        run: |
          cd app
          pnpm run build

  backend:
    name: Rust Backend Gate (cargo test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev

      - name: Pre-build catstep-mcp sidecar
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          echo "host triple: $TRIPLE"
          bash scripts/build-mcp-sidecar.sh "$TRIPLE"

      - name: Cargo Check
        run: |
          cd app/src-tauri
          cargo check

      # The 315-test suite was only ever run locally; CI never enforced it.
      # Blocking from now on — this is the regression gate for path_guard,
      # agent_tools e2e, github_sync E2EE, and the AI SSE/tool-loop code.
      - name: Cargo Test
        run: |
          cd app/src-tauri
          cargo test

      - name: Cargo Clippy
        run: |
          cd app/src-tauri
          cargo clippy --all-targets -- -D warnings

  mcp-server:
    name: MCP Server Gate (cargo test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: mcp-server -> target

      - name: Cargo Test
        run: |
          cd mcp-server
          cargo test

      - name: Cargo Clippy
        run: |
          cd mcp-server
          cargo clippy --all-targets -- -D warnings
