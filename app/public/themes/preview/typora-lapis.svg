<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Background Base -->
  <rect width="480" height="270" fill="#f7fafc" />

  <!-- Window Header Bar -->
  <rect width="480" height="32" fill="#edf2f7" />
  <line x1="0" y1="32" x2="480" y2="32" stroke="#cbd5e0" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56" />
  <circle cx="34" cy="16" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="4" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="7" width="120" height="18" rx="4" fill="#f7fafc" stroke="#cbd5e0" stroke-width="0.8" />
  <text x="240" y="20" fill="#718096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" font-weight="500">typora-lapis.md</text>

  <!-- Content Container -->
  <g transform="translate(24, 46)">
    <!-- Typora Brand Badge + Category Badge -->
    <rect x="0" y="0" width="54" height="18" rx="3" fill="#000000" opacity="0.08" />
    <text x="6" y="13" fill="#2d3748" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9" font-weight="700">Typora</text>

    <rect x="60" y="0" width="120" height="18" rx="3" fill="#009688" opacity="0.16" />
    <text x="68" y="13" fill="#009688" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600">琉璃 · 青绿温润</text>

    <!-- Main Title (H1) -->
    <text x="0" y="42" fill="#2d3748" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
      <tspan fill="#009688" font-weight="800"># </tspan>Lapis · 青天如水
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="3" height="32" fill="#009688" rx="1.5" />
      <text x="12" y="14" fill="#718096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" font-style="italic">
        如天青釉般的温润青绿，典雅清透，宁静致远。
      </text>
      <text x="12" y="29" fill="#718096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">
        GitHub Community · Typora Compatible
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="432" height="42" rx="5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
      <text x="12" y="16" fill="#009688" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" opacity="0.85">lapis.md</text>
      <text x="12" y="32" fill="#2d3748" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5">山色横侵蘸晕霞，湘川风静吐寒花。</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#718096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">主题色系</text>
      <circle cx="68" cy="15" r="6.5" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1" />
      <circle cx="88" cy="15" r="6.5" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1" />
      <circle cx="108" cy="15" r="6.5" fill="#2d3748" stroke="#cbd5e0" stroke-width="1" />
      <circle cx="128" cy="15" r="6.5" fill="#009688" stroke="#cbd5e0" stroke-width="1" />
      <circle cx="148" cy="15" r="6.5" fill="#4db6ac" stroke="#cbd5e0" stroke-width="1" />
      <circle cx="168" cy="15" r="6.5" fill="#80cbc4" stroke="#cbd5e0" stroke-width="1" />
      <text x="432" y="18" fill="#009688" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10.5" text-anchor="end" font-weight="600">typora-lapis</text>
    </g>
  </g>
</svg>