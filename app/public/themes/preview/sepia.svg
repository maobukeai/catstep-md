<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Background Base -->
  <rect width="480" height="270" fill="#f4ecd8" />

  <!-- Window Header Bar -->
  <rect width="480" height="32" fill="#faf3e0" />
  <line x1="0" y1="32" x2="480" y2="32" stroke="#d6c8a4" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56" />
  <circle cx="34" cy="16" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="4" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="7" width="120" height="18" rx="4" fill="#f4ecd8" stroke="#d6c8a4" stroke-width="0.8" />
  <text x="240" y="20" fill="#8b725c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" font-weight="500">sepia.md</text>

  <!-- Content Container -->
  <g transform="translate(24, 46)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="118" height="18" rx="3" fill="#b85c38" opacity="0.16" />
    <text x="8" y="13" fill="#b85c38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600">羊皮纸 · 熊掌记质感</text>

    <!-- Main Title (H1) -->
    <text x="0" y="42" fill="#5b4636" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
      <tspan fill="#b85c38" font-weight="800"># </tspan>温润羊皮纸 · 经典书写
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="3" height="32" fill="#b85c38" rx="1.5" />
      <text x="12" y="14" fill="#8b725c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" font-style="italic">
        复刻经典暖黄羊皮纸底色，沉浸如在古籍书房中伏案。
      </text>
      <text x="12" y="29" fill="#8b725c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">
        Bear 质感复刻 · 暖茶墨水纸张
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="432" height="42" rx="5" fill="#faf3e0" stroke="#d6c8a4" stroke-width="1" />
      <text x="12" y="16" fill="#b85c38" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" opacity="0.85">journal.md</text>
      <text x="12" y="32" fill="#5b4636" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5"># 今日随想：泛黄纸张配暖茶色墨水，久读不累。</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#8b725c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">主题色系</text>
      <circle cx="68" cy="15" r="6.5" fill="#f4ecd8" stroke="#d6c8a4" stroke-width="1" />
      <circle cx="88" cy="15" r="6.5" fill="#faf3e0" stroke="#d6c8a4" stroke-width="1" />
      <circle cx="108" cy="15" r="6.5" fill="#5b4636" stroke="#d6c8a4" stroke-width="1" />
      <circle cx="128" cy="15" r="6.5" fill="#b85c38" stroke="#d6c8a4" stroke-width="1" />
      <circle cx="148" cy="15" r="6.5" fill="#d6c8a4" stroke="#d6c8a4" stroke-width="1" />
      <circle cx="168" cy="15" r="6.5" fill="#a13d2d" stroke="#d6c8a4" stroke-width="1" />
      <text x="432" y="18" fill="#b85c38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10.5" text-anchor="end" font-weight="600">温润羊皮纸 (Bear 护眼)</text>
    </g>
  </g>
</svg>