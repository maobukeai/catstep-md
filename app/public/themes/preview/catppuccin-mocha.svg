<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Background Base -->
  <rect width="480" height="270" fill="#1e1e2e" />

  <!-- Window Header Bar -->
  <rect width="480" height="32" fill="#181825" />
  <line x1="0" y1="32" x2="480" y2="32" stroke="#313244" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56" />
  <circle cx="34" cy="16" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="4" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="7" width="120" height="18" rx="4" fill="#1e1e2e" stroke="#313244" stroke-width="0.8" />
  <text x="240" y="20" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" font-weight="500">catppuccin-mocha.md</text>

  <!-- Content Container -->
  <g transform="translate(24, 46)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="118" height="18" rx="3" fill="#89b4fa" opacity="0.16" />
    <text x="8" y="13" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600">极客顶流 · 薰衣草蓝</text>

    <!-- Main Title (H1) -->
    <text x="0" y="42" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
      <tspan fill="#89b4fa" font-weight="800"># </tspan>Mocha 暗夜 · 梦幻摩卡
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="3" height="32" fill="#89b4fa" rx="1.5" />
      <text x="12" y="14" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" font-style="italic">
        幽邃暗黑底色融入柔和薰衣草紫与天青蓝，代码赏心悦目。
      </text>
      <text x="12" y="29" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">
        全球极客顶流 · 薰衣草天青暗黑
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="432" height="42" rx="5" fill="#181825" stroke="#313244" stroke-width="1" />
      <text x="12" y="16" fill="#89b4fa" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" opacity="0.85">agent.rs</text>
      <text x="12" y="32" fill="#cdd6f4" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5">fn run_engine() -&gt; Result&lt;MochaDark, Error&gt;</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#9399b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">主题色系</text>
      <circle cx="68" cy="15" r="6.5" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
      <circle cx="88" cy="15" r="6.5" fill="#181825" stroke="#313244" stroke-width="1" />
      <circle cx="108" cy="15" r="6.5" fill="#cdd6f4" stroke="#313244" stroke-width="1" />
      <circle cx="128" cy="15" r="6.5" fill="#89b4fa" stroke="#313244" stroke-width="1" />
      <circle cx="148" cy="15" r="6.5" fill="#cba6f7" stroke="#313244" stroke-width="1" />
      <circle cx="168" cy="15" r="6.5" fill="#a6e3a1" stroke="#313244" stroke-width="1" />
      <text x="432" y="18" fill="#89b4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10.5" text-anchor="end" font-weight="600">Catppuccin 摩卡暗夜</text>
    </g>
  </g>
</svg>