<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Background Base -->
  <rect width="480" height="270" fill="#ffffff" />

  <!-- Window Header Bar -->
  <rect width="480" height="32" fill="#f6f8fa" />
  <line x1="0" y1="32" x2="480" y2="32" stroke="#e1e4e8" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56" />
  <circle cx="34" cy="16" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="4" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="7" width="120" height="18" rx="4" fill="#ffffff" stroke="#e1e4e8" stroke-width="0.8" />
  <text x="240" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" font-weight="500">vue.md</text>

  <!-- Content Container -->
  <g transform="translate(24, 46)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="112" height="18" rx="3" fill="#3eaf7c" opacity="0.16" />
    <text x="8" y="13" fill="#3eaf7c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600">VitePress · 清爽纯白</text>

    <!-- Main Title (H1) -->
    <text x="0" y="42" fill="#2c3e50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
      <tspan fill="#3eaf7c" font-weight="800"># </tspan>Vue 翡翠 · 极简文档风
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="3" height="32" fill="#3eaf7c" rx="1.5" />
      <text x="12" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" font-style="italic">
        高雅纯净白底，明澈翡翠翠绿，科技与现代清爽兼备。
      </text>
      <text x="12" y="29" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">
        VitePress 官方美学 · 明澈翠绿
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="432" height="42" rx="5" fill="#f6f8fa" stroke="#e1e4e8" stroke-width="1" />
      <text x="12" y="16" fill="#3eaf7c" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" opacity="0.85">vitepress.config.ts</text>
      <text x="12" y="32" fill="#2c3e50" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5">export default { theme: 'emerald-clean' };</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">主题色系</text>
      <circle cx="68" cy="15" r="6.5" fill="#ffffff" stroke="#e1e4e8" stroke-width="1" />
      <circle cx="88" cy="15" r="6.5" fill="#f6f8fa" stroke="#e1e4e8" stroke-width="1" />
      <circle cx="108" cy="15" r="6.5" fill="#2c3e50" stroke="#e1e4e8" stroke-width="1" />
      <circle cx="128" cy="15" r="6.5" fill="#3eaf7c" stroke="#e1e4e8" stroke-width="1" />
      <circle cx="148" cy="15" r="6.5" fill="#42b883" stroke="#e1e4e8" stroke-width="1" />
      <circle cx="168" cy="15" r="6.5" fill="#10b981" stroke="#e1e4e8" stroke-width="1" />
      <text x="432" y="18" fill="#3eaf7c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10.5" text-anchor="end" font-weight="600">Vue 翡翠极简</text>
    </g>
  </g>
</svg>