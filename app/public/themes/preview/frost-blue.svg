<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Background Base -->
  <rect width="480" height="270" fill="#2e3440" />

  <!-- Window Header Bar -->
  <rect width="480" height="32" fill="#3b4252" />
  <line x1="0" y1="32" x2="480" y2="32" stroke="#434c5e" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56" />
  <circle cx="34" cy="16" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="4" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="7" width="120" height="18" rx="4" fill="#2e3440" stroke="#434c5e" stroke-width="0.8" />
  <text x="240" y="20" fill="#8892b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" font-weight="500">frost-blue.md</text>

  <!-- Content Container -->
  <g transform="translate(24, 46)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="118" height="18" rx="3" fill="#88c0d0" opacity="0.16" />
    <text x="8" y="13" fill="#88c0d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600">北欧极夜 · 冰蓝护眼</text>

    <!-- Main Title (H1) -->
    <text x="0" y="42" fill="#d8dee9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
      <tspan fill="#88c0d0" font-weight="800"># </tspan>Nord 极光 · 冰晶冷调
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="3" height="32" fill="#88c0d0" rx="1.5" />
      <text x="12" y="14" fill="#8892b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" font-style="italic">
        北欧冰川极夜冷灰蓝，理性均衡护眼，克制沉静。
      </text>
      <text x="12" y="29" fill="#8892b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">
        北欧冰川 · 极夜冷灰与冰晶蓝
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="432" height="42" rx="5" fill="#3b4252" stroke="#434c5e" stroke-width="1" />
      <text x="12" y="16" fill="#88c0d0" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" opacity="0.85">glacier.ts</text>
      <text x="12" y="32" fill="#d8dee9" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5">import { ArcticFrost } from '@nord/palette';</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#8892b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">主题色系</text>
      <circle cx="68" cy="15" r="6.5" fill="#2e3440" stroke="#434c5e" stroke-width="1" />
      <circle cx="88" cy="15" r="6.5" fill="#3b4252" stroke="#434c5e" stroke-width="1" />
      <circle cx="108" cy="15" r="6.5" fill="#d8dee9" stroke="#434c5e" stroke-width="1" />
      <circle cx="128" cy="15" r="6.5" fill="#88c0d0" stroke="#434c5e" stroke-width="1" />
      <circle cx="148" cy="15" r="6.5" fill="#81a1c1" stroke="#434c5e" stroke-width="1" />
      <circle cx="168" cy="15" r="6.5" fill="#5e81ac" stroke="#434c5e" stroke-width="1" />
      <text x="432" y="18" fill="#88c0d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10.5" text-anchor="end" font-weight="600">Nord 极光深蓝</text>
    </g>
  </g>
</svg>