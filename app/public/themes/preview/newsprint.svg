<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" style="background:#fbfbf9;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="480" height="270" fill="#fbfbf9" />

  <!-- Window Header Bar -->
  <rect width="480" height="34" fill="#f4f3f0" />
  <line x1="0" y1="34" x2="480" y2="34" stroke="#dedad0" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="17" r="4.5" fill="#ff5f56" />
  <circle cx="36" cy="17" r="4.5" fill="#ffbd2e" />
  <circle cx="52" cy="17" r="4.5" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="8" width="120" height="20" rx="4" fill="#fbfbf9" stroke="#dedad0" stroke-width="0.8" />
  <text x="240" y="22" fill="#77756e" font-family=""Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, Georgia, serif" font-size="10" text-anchor="middle" font-weight="500">newsprint.md</text>

  <!-- Content Container -->
  <g transform="translate(28, 48)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="auto" height="18" rx="3" fill="#9a4d2c" opacity="0.16" />
    <text x="8" y="13" fill="#9a4d2c" font-family=""Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, Georgia, serif" font-size="9.5" font-weight="600">经典宋体 · 人文质感</text>

    <!-- Main Title (H1) -->
    <text x="0" y="40" fill="#333333" font-family=""Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, Georgia, serif" font-size="18" font-weight="700">
      <tspan fill="#9a4d2c" font-weight="800"># </tspan>晚报随笔 · 墨香沉静
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="3" height="30" fill="#9a4d2c" rx="1.5" />
      <text x="12" y="14" fill="#77756e" font-family=""Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, Georgia, serif" font-size="11" font-style="italic">
        铅字落在泛黄的新闻纸上，沉淀着岁月与纸张的温度。
      </text>
      <text x="12" y="28" fill="#77756e" font-family=""Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, Georgia, serif" font-size="10" opacity="0.75">
        人文社科 · 深度纪实随笔
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="424" height="42" rx="5" fill="#f4f3f0" stroke="#dedad0" stroke-width="1" />
      <text x="12" y="16" fill="#9a4d2c" font-family=""Fira Code", "JetBrains Mono", Consolas, monospace" font-size="9" font-weight="600" opacity="0.8">typography</text>
      <text x="12" y="31" fill="#333333" font-family=""Fira Code", "JetBrains Mono", Consolas, monospace" font-size="10.5">font-family: "Source Han Serif", Songti, serif;</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 154)">
      <text x="0" y="18" fill="#77756e" font-family=""Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, Georgia, serif" font-size="9.5" opacity="0.8">色彩基调</text>
      
        <circle cx="70" cy="15" r="7.5" fill="#fbfbf9" stroke="#dedad0" stroke-width="1.2" />
      
        <circle cx="92" cy="15" r="7.5" fill="#f4f3f0" stroke="#dedad0" stroke-width="1.2" />
      
        <circle cx="114" cy="15" r="7.5" fill="#333333" stroke="#dedad0" stroke-width="1.2" />
      
        <circle cx="136" cy="15" r="7.5" fill="#9a4d2c" stroke="#dedad0" stroke-width="1.2" />
      
        <circle cx="158" cy="15" r="7.5" fill="#9e2a2b" stroke="#dedad0" stroke-width="1.2" />
      
        <circle cx="180" cy="15" r="7.5" fill="#386641" stroke="#dedad0" stroke-width="1.2" />
      

      <text x="424" y="18" fill="#9a4d2c" font-family=""Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, Georgia, serif" font-size="10" text-anchor="end" font-weight="600">Newsprint 报刊宋体</text>
    </g>
  </g>
</svg>