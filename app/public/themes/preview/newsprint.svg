<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Background Base -->
  <rect width="480" height="270" fill="#fbfbf9" />

  <!-- Window Header Bar -->
  <rect width="480" height="32" fill="#f4f3f0" />
  <line x1="0" y1="32" x2="480" y2="32" stroke="#dedad0" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56" />
  <circle cx="34" cy="16" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="4" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="7" width="120" height="18" rx="4" fill="#fbfbf9" stroke="#dedad0" stroke-width="0.8" />
  <text x="240" y="20" fill="#77756e" font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', SimSun, Georgia, serif" font-size="10" text-anchor="middle" font-weight="500">newsprint.md</text>

  <!-- Content Container -->
  <g transform="translate(24, 46)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="118" height="18" rx="3" fill="#9a4d2c" opacity="0.16" />
    <text x="8" y="13" fill="#9a4d2c" font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', SimSun, Georgia, serif" font-size="9.5" font-weight="600">经典宋体 · 人文质感</text>

    <!-- Main Title (H1) -->
    <text x="0" y="42" fill="#333333" font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', SimSun, Georgia, serif" font-size="18" font-weight="700">
      <tspan fill="#9a4d2c" font-weight="800"># </tspan>晚报随笔 · 墨香沉静
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="3" height="32" fill="#9a4d2c" rx="1.5" />
      <text x="12" y="14" fill="#77756e" font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', SimSun, Georgia, serif" font-size="11" font-style="italic">
        铅字落在泛黄的新闻纸上，沉淀着岁月与纸张的温度。
      </text>
      <text x="12" y="29" fill="#77756e" font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', SimSun, Georgia, serif" font-size="9.5" opacity="0.8">
        人文社科 · 深度纪实随笔
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="432" height="42" rx="5" fill="#f4f3f0" stroke="#dedad0" stroke-width="1" />
      <text x="12" y="16" fill="#9a4d2c" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" opacity="0.85">typography.css</text>
      <text x="12" y="32" fill="#333333" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5">font-family: 'Source Han Serif SC', serif;</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#77756e" font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', SimSun, Georgia, serif" font-size="9.5" opacity="0.8">主题色系</text>
      <circle cx="68" cy="15" r="6.5" fill="#fbfbf9" stroke="#dedad0" stroke-width="1" />
      <circle cx="88" cy="15" r="6.5" fill="#f4f3f0" stroke="#dedad0" stroke-width="1" />
      <circle cx="108" cy="15" r="6.5" fill="#333333" stroke="#dedad0" stroke-width="1" />
      <circle cx="128" cy="15" r="6.5" fill="#9a4d2c" stroke="#dedad0" stroke-width="1" />
      <circle cx="148" cy="15" r="6.5" fill="#9e2a2b" stroke="#dedad0" stroke-width="1" />
      <circle cx="168" cy="15" r="6.5" fill="#386641" stroke="#dedad0" stroke-width="1" />
      <text x="432" y="18" fill="#9a4d2c" font-family="'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', SimSun, Georgia, serif" font-size="10.5" text-anchor="end" font-weight="600">Newsprint 报刊宋体</text>
    </g>
  </g>
</svg>