<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Background Base -->
  <rect width="480" height="270" fill="#ffffff" />

  <!-- Window Header Bar -->
  <rect width="480" height="32" fill="#f5f5f5" />
  <line x1="0" y1="32" x2="480" y2="32" stroke="#e0e0e0" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56" />
  <circle cx="34" cy="16" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="4" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="7" width="120" height="18" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" />
  <text x="240" y="20" fill="#757575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" font-weight="500">typora-material.md</text>

  <!-- Content Container -->
  <g transform="translate(24, 46)">
    <!-- Typora Brand Badge + Category Badge -->
    <rect x="0" y="0" width="54" height="18" rx="3" fill="#000000" opacity="0.08" />
    <text x="6" y="13" fill="#212121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9" font-weight="700">Typora</text>

    <rect x="60" y="0" width="120" height="18" rx="3" fill="#1976d2" opacity="0.16" />
    <text x="68" y="13" fill="#1976d2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600">Material · 谷歌质感</text>

    <!-- Main Title (H1) -->
    <text x="0" y="42" fill="#212121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
      <tspan fill="#1976d2" font-weight="800"># </tspan>Material · 现代卡片设计
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="3" height="32" fill="#1976d2" rx="1.5" />
      <text x="12" y="14" fill="#757575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" font-style="italic">
        精准的微阴影层次与留白，经典现代工业风。
      </text>
      <text x="12" y="29" fill="#757575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">
        GitHub Community · Typora Compatible
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="432" height="42" rx="5" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1" />
      <text x="12" y="16" fill="#1976d2" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" opacity="0.85">material.css</text>
      <text x="12" y="32" fill="#212121" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5">card { elevation: 2; border-radius: 4px; }</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#757575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">主题色系</text>
      <circle cx="68" cy="15" r="6.5" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
      <circle cx="88" cy="15" r="6.5" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1" />
      <circle cx="108" cy="15" r="6.5" fill="#212121" stroke="#e0e0e0" stroke-width="1" />
      <circle cx="128" cy="15" r="6.5" fill="#1976d2" stroke="#e0e0e0" stroke-width="1" />
      <circle cx="148" cy="15" r="6.5" fill="#0288d1" stroke="#e0e0e0" stroke-width="1" />
      <circle cx="168" cy="15" r="6.5" fill="#26a69a" stroke="#e0e0e0" stroke-width="1" />
      <text x="432" y="18" fill="#1976d2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10.5" text-anchor="end" font-weight="600">typora-material</text>
    </g>
  </g>
</svg>