<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Background Base -->
  <rect width="480" height="270" fill="#000000" />

  <!-- Window Header Bar -->
  <rect width="480" height="32" fill="#0d0d0d" />
  <line x1="0" y1="32" x2="480" y2="32" stroke="#222222" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56" />
  <circle cx="34" cy="16" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="4" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="7" width="120" height="18" rx="4" fill="#000000" stroke="#222222" stroke-width="0.8" />
  <text x="240" y="20" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" font-weight="500">pure-black-oled.md</text>

  <!-- Content Container -->
  <g transform="translate(24, 46)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="118" height="18" rx="3" fill="#50fa7b" opacity="0.16" />
    <text x="8" y="13" fill="#50fa7b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600">真正纯黑 · OLED省电</text>

    <!-- Main Title (H1) -->
    <text x="0" y="42" fill="#e8e8e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
      <tspan fill="#50fa7b" font-weight="800"># </tspan>Pure Black · 纯黑暗室
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="3" height="32" fill="#50fa7b" rx="1.5" />
      <text x="12" y="14" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" font-style="italic">
        绝对零光纯黑 (#000000)，OLED 屏幕发光关断，深夜专注。
      </text>
      <text x="12" y="29" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">
        极致 #000000 · 像素级关屏省电
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="432" height="42" rx="5" fill="#0d0d0d" stroke="#222222" stroke-width="1" />
      <text x="12" y="16" fill="#50fa7b" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" opacity="0.85">oled.sh</text>
      <text x="12" y="32" fill="#e8e8e8" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5">echo 'Zero pixel emission. True black.'</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">主题色系</text>
      <circle cx="68" cy="15" r="6.5" fill="#000000" stroke="#222222" stroke-width="1" />
      <circle cx="88" cy="15" r="6.5" fill="#111111" stroke="#222222" stroke-width="1" />
      <circle cx="108" cy="15" r="6.5" fill="#222222" stroke="#222222" stroke-width="1" />
      <circle cx="128" cy="15" r="6.5" fill="#e8e8e8" stroke="#222222" stroke-width="1" />
      <circle cx="148" cy="15" r="6.5" fill="#50fa7b" stroke="#222222" stroke-width="1" />
      <circle cx="168" cy="15" r="6.5" fill="#38bdf8" stroke="#222222" stroke-width="1" />
      <text x="432" y="18" fill="#50fa7b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10.5" text-anchor="end" font-weight="600">Pure Black (OLED 纯黑)</text>
    </g>
  </g>
</svg>