<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" style="background:#282a36;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="480" height="270" fill="#282a36" />

  <!-- Window Header Bar -->
  <rect width="480" height="34" fill="#343746" />
  <line x1="0" y1="34" x2="480" y2="34" stroke="#44475a" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="17" r="4.5" fill="#ff5f56" />
  <circle cx="36" cy="17" r="4.5" fill="#ffbd2e" />
  <circle cx="52" cy="17" r="4.5" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="8" width="120" height="20" rx="4" fill="#282a36" stroke="#44475a" stroke-width="0.8" />
  <text x="240" y="22" fill="#a3a7c2" font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif" font-size="10" text-anchor="middle" font-weight="500">dracula.md</text>

  <!-- Content Container -->
  <g transform="translate(28, 48)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="auto" height="18" rx="3" fill="#bd93f9" opacity="0.16" />
    <text x="8" y="13" fill="#bd93f9" font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif" font-size="9.5" font-weight="600">经典霓虹 · 高对比暗黑</text>

    <!-- Main Title (H1) -->
    <text x="0" y="40" fill="#f8f8f2" font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif" font-size="18" font-weight="700">
      <tspan fill="#bd93f9" font-weight="800"># </tspan>Dracula · 经典德古拉
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="3" height="30" fill="#bd93f9" rx="1.5" />
      <text x="12" y="14" fill="#a3a7c2" font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif" font-size="11" font-style="italic">
        吸血鬼霓虹紫粉与极光翠绿碰撞，张扬且耐看。
      </text>
      <text x="12" y="28" fill="#a3a7c2" font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif" font-size="10" opacity="0.75">
        哥特经典 · 霓虹紫粉高对比
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="424" height="42" rx="5" fill="#343746" stroke="#44475a" stroke-width="1" />
      <text x="12" y="16" fill="#bd93f9" font-family=""Fira Code", "JetBrains Mono", Consolas, monospace" font-size="9" font-weight="600" opacity="0.8">dracula.py</text>
      <text x="12" y="31" fill="#f8f8f2" font-family=""Fira Code", "JetBrains Mono", Consolas, monospace" font-size="10.5">def bite(code): return DraculaTheme(neon=True)</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 154)">
      <text x="0" y="18" fill="#a3a7c2" font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif" font-size="9.5" opacity="0.8">色彩基调</text>
      
        <circle cx="70" cy="15" r="7.5" fill="#282a36" stroke="#44475a" stroke-width="1.2" />
      
        <circle cx="92" cy="15" r="7.5" fill="#44475a" stroke="#44475a" stroke-width="1.2" />
      
        <circle cx="114" cy="15" r="7.5" fill="#bd93f9" stroke="#44475a" stroke-width="1.2" />
      
        <circle cx="136" cy="15" r="7.5" fill="#ff79c6" stroke="#44475a" stroke-width="1.2" />
      
        <circle cx="158" cy="15" r="7.5" fill="#50fa7b" stroke="#44475a" stroke-width="1.2" />
      
        <circle cx="180" cy="15" r="7.5" fill="#8be9fd" stroke="#44475a" stroke-width="1.2" />
      

      <text x="424" y="18" fill="#bd93f9" font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif" font-size="10" text-anchor="end" font-weight="600">Dracula 经典德古拉</text>
    </g>
  </g>
</svg>