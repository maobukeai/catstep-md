<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Background Base -->
  <rect width="480" height="270" fill="#282a36" />

  <!-- Window Header Bar -->
  <rect width="480" height="32" fill="#343746" />
  <line x1="0" y1="32" x2="480" y2="32" stroke="#44475a" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="20" cy="16" r="4" fill="#ff5f56" />
  <circle cx="34" cy="16" r="4" fill="#ffbd2e" />
  <circle cx="48" cy="16" r="4" fill="#27c93f" />

  <!-- Tab Title in Header -->
  <rect x="180" y="7" width="120" height="18" rx="4" fill="#282a36" stroke="#44475a" stroke-width="0.8" />
  <text x="240" y="20" fill="#a3a7c2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" font-weight="500">dracula.md</text>

  <!-- Content Container -->
  <g transform="translate(24, 46)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="128" height="18" rx="3" fill="#bd93f9" opacity="0.16" />
    <text x="8" y="13" fill="#bd93f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600">经典霓虹 · 高对比暗黑</text>

    <!-- Main Title (H1) -->
    <text x="0" y="42" fill="#f8f8f2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="700">
      <tspan fill="#bd93f9" font-weight="800"># </tspan>Dracula · 经典德古拉
    </text>

    <!-- Blockquote Section -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="3" height="32" fill="#bd93f9" rx="1.5" />
      <text x="12" y="14" fill="#a3a7c2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" font-style="italic">
        吸血鬼哥特暗夜，霓虹紫粉与极光翠绿强对比高亮。
      </text>
      <text x="12" y="29" fill="#a3a7c2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">
        哥特经典 · 霓虹紫粉高对比
      </text>
    </g>

    <!-- Code Block Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="432" height="42" rx="5" fill="#343746" stroke="#44475a" stroke-width="1" />
      <text x="12" y="16" fill="#bd93f9" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="9" font-weight="600" opacity="0.85">dracula.py</text>
      <text x="12" y="32" fill="#f8f8f2" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5">def activate(): return Dracula(neon=True)</text>
    </g>

    <!-- Bottom Palette Bar -->
    <g transform="translate(0, 160)">
      <text x="0" y="18" fill="#a3a7c2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="9.5" opacity="0.8">主题色系</text>
      <circle cx="68" cy="15" r="6.5" fill="#282a36" stroke="#44475a" stroke-width="1" />
      <circle cx="88" cy="15" r="6.5" fill="#44475a" stroke="#44475a" stroke-width="1" />
      <circle cx="108" cy="15" r="6.5" fill="#bd93f9" stroke="#44475a" stroke-width="1" />
      <circle cx="128" cy="15" r="6.5" fill="#ff79c6" stroke="#44475a" stroke-width="1" />
      <circle cx="148" cy="15" r="6.5" fill="#50fa7b" stroke="#44475a" stroke-width="1" />
      <circle cx="168" cy="15" r="6.5" fill="#8be9fd" stroke="#44475a" stroke-width="1" />
      <text x="432" y="18" fill="#bd93f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="10.5" text-anchor="end" font-weight="600">Dracula 经典德古拉</text>
    </g>
  </g>
</svg>