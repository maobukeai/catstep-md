<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Catstep MD document icon</title>
  <desc id="desc">A clean paper document carrying the Catstep MD Markdown mark and paw.</desc>
  <defs>
    <filter id="docShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="mdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Base Paper Shadow & Sheet -->
  <g filter="url(#docShadow)">
    <path d="M220 96 H650 L830 276 V890 Q830 928 792 928 H220 Q182 928 182 890 V134 Q182 96 220 96 Z"
          fill="url(#paperGrad)" stroke="#CBD5E1" stroke-width="8" stroke-linejoin="round" />
    <!-- Folded Corner -->
    <path d="M650 96 V246 Q650 276 680 276 H830 Z"
          fill="url(#foldGrad)" stroke="#93C5FD" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Catstep MD Cat Paw Emblem -->
  <g fill="#3B82F6" opacity="0.88" transform="translate(506, 360)">
    <!-- Main pad -->
    <ellipse cx="0" cy="0" rx="56" ry="44" />
    <!-- 4 toe beans -->
    <ellipse cx="-60" cy="-58" rx="20" ry="28" transform="rotate(-20 -60 -58)" />
    <ellipse cx="-22" cy="-80" rx="20" ry="28" transform="rotate(-6 -22 -80)" />
    <ellipse cx="22" cy="-80" rx="20" ry="28" transform="rotate(6 22 -80)" />
    <ellipse cx="60" cy="-58" rx="20" ry="28" transform="rotate(20 60 -58)" />
  </g>

  <!-- MD Bold Typography -->
  <text x="506" y="585"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="176" font-weight="900" letter-spacing="4"
        fill="url(#mdGrad)" text-anchor="middle">MD</text>

  <!-- Subtle Markdown lines -->
  <g fill="#94A3B8" opacity="0.45">
    <rect x="264" y="670" width="496" height="22" rx="11" />
    <rect x="264" y="720" width="430" height="22" rx="11" />
    <rect x="264" y="770" width="470" height="22" rx="11" />
    <rect x="264" y="820" width="320" height="22" rx="11" />
  </g>
</svg>
